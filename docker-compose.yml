services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: presidio-analyzer
    ports:
      - "5002:3000"

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    container_name: presidio-anonymizer
    ports:
      - "5001:3000"

  presidio-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presidio-api
    ports:
      - "8000:8000"
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer
    environment:
      - PYTHONUNBUFFERED=1
      - ANALYZER_URL=http://presidio-analyzer:3000/analyze
      - ANONYMIZER_URL=http://presidio-anonymizer:3000/anonymize
    command: uvicorn api:app --host 0.0.0.0 --port 8000
